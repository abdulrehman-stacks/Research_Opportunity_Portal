<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Opportunity Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body><div class="container py-4">
<h1 class="h3 mb-3">University Research Opportunity Portal</h1>
<div id="alerts"></div>
<div class="row g-3">
 <div class="col-lg-7"><div class="card"><div class="card-header fw-bold">All Opportunities</div>
  <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Title</th><th>Faculty</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody id="list"></tbody></table></div></div></div>
 <div class="col-lg-5">
  <div class="card mb-3"><div class="card-header fw-bold">Details</div><div class="card-body" id="details"><span class="text-muted">Select an opportunity.</span></div></div>
  <div class="card"><div class="card-header fw-bold" id="formTitle">Create Opportunity</div><div class="card-body">
   <form id="form" novalidate><input type="hidden" id="id">
    <div class="mb-2"><label class="form-label">Title</label><input class="form-control" id="title" maxlength="200" required></div>
    <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="description" rows="3" required></textarea></div>
    <div class="mb-2"><label class="form-label">Research Area</label><input class="form-control" id="research_area" maxlength="100" required></div>
    <div class="mb-2"><label class="form-label">Faculty Name</label><input class="form-control" id="faculty_name" maxlength="100" required></div>
    <div class="mb-2"><label class="form-label">Department</label><input class="form-control" id="department" maxlength="100" required></div>
    <div class="mb-2"><label class="form-label">Required Skills</label><input class="form-control" id="required_skills" maxlength="255" required></div>
    <div class="row"><div class="col mb-2"><label class="form-label">Positions</label><input type="number" min="1" class="form-control" id="available_positions" required></div>
    <div class="col mb-2"><label class="form-label">Deadline</label><input type="date" class="form-control" id="application_deadline" required></div></div>
    <div class="mb-3"><label class="form-label">Status</label><select class="form-select" id="status"><option>Open</option><option>Closed</option></select></div>
    <button class="btn btn-primary" type="submit" id="saveBtn">Create</button>
    <button class="btn btn-outline-secondary" type="button" id="resetBtn">Clear</button>
   </form></div></div>
 </div></div></div>
<script src="app.js"></script></body></html>
